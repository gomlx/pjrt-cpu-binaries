name: "windows/amd64"
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: "Build PJRT"
    runs-on: windows-latest
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    defaults:
      run:
        shell: bash

    steps:
      - uses: actions/checkout@v6

      - name: "Initialize MSVC and LLVM"
        run: |
          choco install llvm -y
          VSWHERE="/c/Program Files (x86)/Microsoft Visual Studio/Installer/vswhere.exe"
          if [ ! -f "$VSWHERE" ]; then
            VSWHERE="/c/Program Files/Microsoft Visual Studio/Installer/vswhere.exe"
          fi
          VS_INSTALL_DIR="$("$VSWHERE" -products '*' -latest -property installationPath | tr '\\' '/')"
          echo "Found VS Install Dir: $VS_INSTALL_DIR"
          
          # Initialize MSVC environment variables using vcvars64.bat
          VCVARS_POSIX="$(find "$VS_INSTALL_DIR" -name "vcvars64.bat" | head -n 1)"
          VCVARS_WIN="$(cygpath -w "$VCVARS_POSIX")"
          echo "Found vcvars64.bat at: $VCVARS_WIN"
          cmd.exe //c call "$VCVARS_WIN" "&&" set > vcvars_env.txt
          while IFS='=' read -r key val; do
            if [ -n "$key" ] && [ -n "$val" ]; then
              if [ "$key" = "PATH" ] || [ "$key" = "Path" ] || [ "$key" = "path" ]; then
                echo "$val" | tr ';' '\n' | while read -r p; do
                  if [ -n "$p" ] && [[ "$p" != *"WindowsApps"* ]]; then
                    echo "$(cygpath -u "$p" 2>/dev/null || echo "$p")" >> $GITHUB_PATH
                  fi
                done
              else
                echo "${key}=${val}" >> $GITHUB_ENV
              fi
            fi
          done < vcvars_env.txt
          # Ensure Chocolatey's bazel.exe (Bazel 9.x) does not shadow Bazelisk (which uses xla/.bazelversion)
          if [ -f "/c/ProgramData/Chocolatey/bin/bazelisk.exe" ]; then
            cp -f "/c/ProgramData/Chocolatey/bin/bazelisk.exe" "/c/ProgramData/Chocolatey/bin/bazel.exe" || true
          else
            rm -f "/c/ProgramData/Chocolatey/bin/bazel.exe" || true
          fi
          echo "/c/Program Files/Git/usr/bin" >> $GITHUB_PATH
          echo "/c/Program Files/LLVM/bin" >> $GITHUB_PATH

      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: "Clone and checkout XLA"
        run: |
          git clone https://github.com/openxla/xla
          cd xla
          HASH=$(cat ../XLA_COMMIT_HASH.txt)
          echo "Checking out XLA at commit: $HASH"
          git checkout $HASH

      - name: "Setup Bazelisk (for Bazel)"
        uses: bazel-contrib/setup-bazel@0.18.0
        with:
          module-root: xla
          output-base: C:/b
          bazelisk-cache: true
          disk-cache: ${{ github.workflow }}
          repository-cache: false

      - name: "Extract version numbers"
        run: |
          BUILDER_VERSION="$(cat BUILDER_VERSION.txt)"
          PJRT_C_API_HEADER="./xla/xla/pjrt/c/pjrt_c_api.h"
          MAJOR=$(grep -E '#define PJRT_API_MAJOR' "${PJRT_C_API_HEADER}" | awk '{print $3}')
          MINOR=$(grep -E '#define PJRT_API_MINOR' "${PJRT_C_API_HEADER}" | awk '{print $3}')
          echo "Building PJRT CPU plugin for version ${MAJOR}.${MINOR} (to be used in go-xla as v${MAJOR}.${MINOR}.${BUILDER_VERSION})"
          echo "RELEASE_VERSION=v${MAJOR}.${MINOR}.${BUILDER_VERSION}" >> $GITHUB_ENV

      - name: "Configure XLA"
        run: |
          cd xla

          # Setup dummy ROCm and CUDA packages for any legacy override_repository flags
          mkdir -p ../dummy_rocm/rocm ../dummy_cuda/cuda
          touch ../dummy_rocm/MODULE.bazel ../dummy_cuda/MODULE.bazel
          
          cat << 'EOF' > ../dummy_rocm/BUILD
          load("@rules_cc//cc:defs.bzl", "cc_library")
          package(default_visibility = ["//visibility:public"])
          cc_library(name = "rocm")

          config_setting(
              name = "using_hipcc",
              values = {"define": "never_true_dummy=1"},
          )
          EOF
          cat << 'EOF' > ../dummy_rocm/rocm/BUILD
          load("@rules_cc//cc:defs.bzl", "cc_library")
          package(default_visibility = ["//visibility:public"])
          cc_library(name = "rocm")
          cc_library(name = "hip")
          cc_library(name = "rocm_headers")

          config_setting(
              name = "using_hipcc",
              values = {"define": "never_true_dummy=1"},
          )
          EOF
          
          cat << 'EOF' > ../dummy_rocm/rocm/build_defs.bzl
          load("@rules_cc//cc:defs.bzl", "cc_library")

          def if_rocm(x, default = []):
              return default
          def if_rocm_is_configured(x, default = []):
              return default
          def if_rocm_hip_khr_cooperative_groups(x, default = []):
              return default
          def if_cuda_or_rocm(x, default = []):
              return default
          def if_gpu_is_configured(x, default = []):
              return default
          def is_rocm_configured():
              return False
          def get_rbe_amdgpu_pool(*args, **kwargs):
              return ""
          def rocm_default_copts(*args, **kwargs):
              return []
          def rocm_library(name, **kwargs):
              cc_library(name = name, **kwargs)
          EOF
          cp ../dummy_rocm/rocm/build_defs.bzl ../dummy_rocm/build_defs.bzl

          cat << 'EOF' > ../dummy_cuda/BUILD
          load("@rules_cc//cc:defs.bzl", "cc_library")
          package(default_visibility = ["//visibility:public"])
          cc_library(name = "cuda")

          config_setting(
              name = "is_cuda_enabled",
              values = {"define": "never_true_dummy=1"},
          )
          EOF
          cat << 'EOF' > ../dummy_cuda/cuda/BUILD
          load("@rules_cc//cc:defs.bzl", "cc_library")
          package(default_visibility = ["//visibility:public"])
          cc_library(name = "cuda")
          cc_library(name = "cuda_headers")
          cc_library(name = "cudnn")
          cc_library(name = "cublas")
          cc_library(name = "cufft")
          cc_library(name = "curand")
          cc_library(name = "cusolver")
          cc_library(name = "cusparse")

          config_setting(
              name = "using_nvcc",
              values = {"define": "never_true_dummy=1"},
          )
          config_setting(
              name = "is_cuda_enabled",
              values = {"define": "never_true_dummy=1"},
          )
          EOF
          
          cat << 'EOF' > ../dummy_cuda/cuda/build_defs.bzl
          load("@rules_cc//cc:defs.bzl", "cc_library")

          def if_cuda(x, default = []):
              return default
          def if_cuda_is_configured(x, default = []):
              return default
          def if_cuda_or_rocm(x, default = []):
              return default
          def if_gpu_is_configured(x, default = []):
              return default
          def if_cuda_newer_than(version, if_true, if_false = []):
              return if_false
          def is_cuda_configured():
              return False
          def cuda_default_copts(*args, **kwargs):
              return []
          def cuda_library(name, **kwargs):
              cc_library(name = name, **kwargs)
          def cuda_header_library(name, **kwargs):
              cc_library(name = name, **kwargs)
          def if_cuda_clang(x, default = []):
              return default
          EOF
          cp ../dummy_cuda/cuda/build_defs.bzl ../dummy_cuda/build_defs.bzl

          export CC=C:/PROGRA~1/LLVM/bin/clang-cl.exe
          export CXX=C:/PROGRA~1/LLVM/bin/clang-cl.exe
          PY_PATH="$(cygpath -m "$(which python)")"
          export PYTHON_BIN_PATH="${PY_PATH}"
          export HERMETIC_PYTHON_VERSION=3.11
          export TF_NEED_ROCM=0
          export TF_NEED_CUDA=0
          python configure.py --backend=cpu --os=windows --host_compiler=clang --clang_path=C:/PROGRA~1/LLVM/bin/clang.exe
          cat xla_configure.bazelrc

      - name: "Fix Windows paths and environment"
        run: |
          cd xla
          # Stub warnings.bazelrc to prevent -Werror from breaking MSVC/cl.exe
          echo "build:warnings --copt=-D_CRT_SECURE_NO_WARNINGS" > warnings.bazelrc

          # Disable windows_enable_symlinks so Bazel uses absolute NTFS junctions and file copies
          sed -i '/windows_enable_symlinks/d' tensorflow.bazelrc .bazelrc
          echo "build --noenable_runfiles" >> xla_configure.bazelrc

          # 1. Fix empty python_path flags generated by configure.py
          sed -i '/python_path/d' xla_configure.bazelrc
          sed -i '/-Wno-sign-compare/d' xla_configure.bazelrc
          sed -i '/-Wno-error/d' xla_configure.bazelrc
          sed -i '/-Wno-c23-extensions/d' xla_configure.bazelrc
          sed -i '/USE_CLANG_CL/d' xla_configure.bazelrc
          sed -i '/BAZEL_LLVM/d' xla_configure.bazelrc

          # 2. Fix Windows paths for Bazel compatibility
          sed -i 's|Program Files (x86)|PROGRA~2|g' xla_configure.bazelrc
          sed -i 's|Program Files|PROGRA~1|g' xla_configure.bazelrc
          sed -i 's|\\|/|g' xla_configure.bazelrc
          sed -i 's|clang\.exe|clang-cl.exe|g' xla_configure.bazelrc

          # 3. Prevent Git-Bash from expanding /MT into a path by using the -MT syntax
          echo "common --check_direct_dependencies=off" >> xla_configure.bazelrc
          echo "build --incompatible_enable_cc_toolchain_resolution=false" >> xla_configure.bazelrc
          echo "build --compiler=clang-cl" >> xla_configure.bazelrc
          echo "build --copt=-MT" >> xla_configure.bazelrc
          echo "build --host_copt=-MT" >> xla_configure.bazelrc
          echo "build --copt=-D_CRT_SECURE_NO_WARNINGS" >> xla_configure.bazelrc
          echo "build --host_copt=-D_CRT_SECURE_NO_WARNINGS" >> xla_configure.bazelrc
          echo "build --copt=-DZSTD_DISABLE_ASM=1" >> xla_configure.bazelrc
          echo "build --host_copt=-DZSTD_DISABLE_ASM=1" >> xla_configure.bazelrc
          echo "build --copt=-mavx2" >> xla_configure.bazelrc
          echo "build --copt=-mfma" >> xla_configure.bazelrc
          echo "build --copt=-mf16c" >> xla_configure.bazelrc
          echo "build --copt=-mbmi" >> xla_configure.bazelrc
          echo "build --copt=-mbmi2" >> xla_configure.bazelrc
          echo "build --copt=-mlzcnt" >> xla_configure.bazelrc

          # 4. Force one-file-at-a-time compilation to fix clang-cl /Fo error
          echo "build --features=-compiler_param_file" >> xla_configure.bazelrc
          echo "build --host_features=-compiler_param_file" >> xla_configure.bazelrc
          echo "build --features=archive_param_file" >> xla_configure.bazelrc
          echo "build --host_features=archive_param_file" >> xla_configure.bazelrc
          echo "build --features=linker_param_file" >> xla_configure.bazelrc
          echo "build --host_features=linker_param_file" >> xla_configure.bazelrc

          # 5. Linker safety
          echo "build --linkopt=/FORCE:MULTIPLE" >> xla_configure.bazelrc
          echo "build --host_linkopt=/FORCE:MULTIPLE" >> xla_configure.bazelrc

          # 6. Compiler Paths
          echo "build --action_env=CC=C:/PROGRA~1/LLVM/bin/clang-cl.exe" >> xla_configure.bazelrc
          echo "build --action_env=CXX=C:/PROGRA~1/LLVM/bin/clang-cl.exe" >> xla_configure.bazelrc
          echo "build --repo_env=CC=C:/PROGRA~1/LLVM/bin/clang-cl.exe" >> xla_configure.bazelrc
          echo "build --repo_env=CXX=C:/PROGRA~1/LLVM/bin/clang-cl.exe" >> xla_configure.bazelrc
          echo "build --repo_env=USE_CLANG_CL=1" >> xla_configure.bazelrc
          echo "build --repo_env=BAZEL_LLVM=C:/PROGRA~1/LLVM" >> xla_configure.bazelrc
          echo "build --repo_env=BAZEL_LLVM_RESPECT_CLANG_ONLY=1" >> xla_configure.bazelrc
          echo "build --action_env=BAZEL_COMPILER=clang-cl" >> xla_configure.bazelrc
          echo "build --repo_env=BAZEL_COMPILER=clang-cl" >> xla_configure.bazelrc
          echo "build --action_env=BAZEL_SH=C:/PROGRA~1/Git/usr/bin/bash.exe" >> xla_configure.bazelrc
          echo "build --repo_env=BAZEL_SH=C:/PROGRA~1/Git/usr/bin/bash.exe" >> xla_configure.bazelrc
          echo "build --repo_env=HERMETIC_PYTHON_VERSION=3.11" >> xla_configure.bazelrc
          echo "build --repo_env=TF_NEED_ROCM=0" >> xla_configure.bazelrc
          echo "build --repo_env=TF_NEED_CUDA=0" >> xla_configure.bazelrc

          echo "Applying dllexport patch ---------------"
          git apply --ignore-whitespace --3way ../internal/patches/windows/export.patch
          python -c "p='xla/tsl/util/filewrapper.cc'; c=open(p).read().replace('#if defined(COMPILER_MSVC)', '#if defined(COMPILER_MSVC) || defined(_MSC_VER) || defined(__clang__)'); assert 'defined(_MSC_VER)' in c; open(p,'w').write(c)"

          # Patch third_party/net_zstd.BUILD directly in source tree to disable .S assembly on Windows
          python -c "p='third_party/net_zstd.BUILD'; c=open(p).read().replace('glob([\"decompress/*_amd64.S\"])', '[]'); open(p,'w').write(c)"

          # Prevent llvm_configure from being cached as reproducible without @llvm-raw junctions,
          # and disable BLAKE3 x86_64 GAS assembly (.S) on Windows (where rules_cc invokes ml64.exe)
          python -c "p='third_party/llvm/repo_metadata.patch'; open(p,'a').write('\ndiff --git a/utils/bazel/configure.bzl b/utils/bazel/configure.bzl\n--- a/utils/bazel/configure.bzl\n+++ b/utils/bazel/configure.bzl\n@@ -208,5 +208,5 @@ def _llvm_configure_impl(repository_ctx):\n \n-    if hasattr(repository_ctx, \"repo_metadata\"):\n-        return repository_ctx.repo_metadata(reproducible = True)\n+    if False and hasattr(repository_ctx, \"repo_metadata\"):\n+        return repository_ctx.repo_metadata(reproducible = True)\n \n llvm_configure = repository_rule(\ndiff --git a/utils/bazel/llvm-project-overlay/llvm/BUILD.bazel b/utils/bazel/llvm-project-overlay/llvm/BUILD.bazel\n--- a/utils/bazel/llvm-project-overlay/llvm/BUILD.bazel\n+++ b/utils/bazel/llvm-project-overlay/llvm/BUILD.bazel\n@@ -463,7 +463,6 @@ cc_library(\n         \"@platforms//cpu:aarch64\": [\n             \"lib/Support/BLAKE3/blake3_neon.c\",\n         ],\n-        \"@platforms//cpu:x86_64\": [\":blake3_x86_64_asm\"],\n         \"//conditions:default\": [\n         ],\n     }),\n@@ -492,8 +491,6 @@ cc_library(\n         ],\n         \"//conditions:default\": [\"BLAKE3_USE_NEON=0\"],\n     }) + select({\n-        \"@platforms//cpu:x86_64\": [\n-        ],\n         \"//conditions:default\": [\n             \"BLAKE3_NO_AVX2\",\n             \"BLAKE3_NO_AVX512\",\n')"

      - name: "Build PJRT C API CPU plugin"
        run: |
          # AVX-512 is disabled because is doesn't gracefully fallback to AVX2 in runtime,
          # instead it was just crashing. So we build only with AVX2.
          cd xla
          printf "\nStarting XLA bazel build:\n"
          bazel --version
          export CC="C:/PROGRA~1/LLVM/bin/clang-cl.exe"
          export CXX="C:/PROGRA~1/LLVM/bin/clang-cl.exe"
          export USE_CLANG_CL=1
          export BAZEL_LLVM="C:/PROGRA~1/LLVM"
          export BAZEL_LLVM_RESPECT_CLANG_ONLY=1
          export BAZEL_COMPILER="clang-cl"
          export BAZEL_SH="C:/PROGRA~1/Git/usr/bin/bash.exe"
          export HERMETIC_PYTHON_VERSION=3.11
          CLANG_INC_DIR="$(find "/c/Program Files/LLVM/lib/clang" -maxdepth 2 -name "include" -type d 2>/dev/null | head -n 1)"
          if [ -n "$CLANG_INC_DIR" ]; then
            CLANG_INC_WIN="$(cygpath -w "$CLANG_INC_DIR")"
            export INCLUDE="${CLANG_INC_WIN};${INCLUDE}"
          fi
          export PATH="/c/Program Files/Git/usr/bin:/c/Program Files/Git/bin:$PATH"

          patch_external_repos() {
            find /c/b/external -maxdepth 2 -path "*net_zstd*/BUILD.bazel" -exec python -c "import sys; p=sys.argv[1]; c=open(p).read().replace('glob([\"decompress/*_amd64.S\"])', '[]'); open(p,'w').write(c)" {} \; 2>/dev/null || true
            find /c/b/external -maxdepth 2 -path "*snappy*/BUILD.bazel" -exec python -c "import sys, re; p=sys.argv[1]; c=open(p).read(); py='cmd = \"python -c \\\"import sys; text = open(sys.argv[1]).read().replace(\'\\\\\$${HAVE_SYS_UIO_H_01}\', \'0\').replace(\'\\\\\$${PROJECT_VERSION_MAJOR}\', \'1\').replace(\'\\\\\$${PROJECT_VERSION_MINOR}\', \'2\').replace(\'\\\\\$${PROJECT_VERSION_PATCH}\', \'2\'); open(sys.argv[2], \'w\').write(text)\\\" $< $@\"'; open(p,'w').write(re.sub(r'(?s)cmd = \(\"\"\"sed.*?\%\s*SNAPPY_VERSION\)', py, c))" {} \; 2>/dev/null || true
            find /c/b/external -maxdepth 2 -path "*XNNPACK*/build_params.bzl" -exec python -c "import sys; p=sys.argv[1]; c=open(p).read(); f='[\"-Xclang\", \"-target-feature\", \"-Xclang\", \"+avx512f\", \"-Xclang\", \"-target-feature\", \"-Xclang\", \"+avx512cd\", \"-Xclang\", \"-target-feature\", \"-Xclang\", \"+avx512bw\", \"-Xclang\", \"-target-feature\", \"-Xclang\", \"+avx512dq\", \"-Xclang\", \"-target-feature\", \"-Xclang\", \"+avx512vl\", \"-Xclang\", \"-target-feature\", \"-Xclang\", \"+avx512vnni\", \"-Xclang\", \"-target-feature\", \"-Xclang\", \"+avx512bf16\", \"-Xclang\", \"-target-feature\", \"-Xclang\", \"+avx512vbmi\", \"-Xclang\", \"-target-feature\", \"-Xclang\", \"+avx512fp16\", \"-Xclang\", \"-target-feature\", \"-Xclang\", \"+amx-tile\", \"-Xclang\", \"-target-feature\", \"-Xclang\", \"+amx-int8\", \"-Xclang\", \"-target-feature\", \"-Xclang\", \"+amx-bf16\", \"-Xclang\", \"-target-feature\", \"-Xclang\", \"+amx-fp16\"]'; open(p,'w').write(c if '+avx512fp16' in c else c.replace('copts = _x86_align_stack(64),', 'copts = _x86_align_stack(64) + ' + f + ','))" {} \; 2>/dev/null || true
            find /c/b/external -maxdepth 3 -path "*XNNPACK*/ynnpack/build_defs.bzl" -exec python -c "import sys; p=sys.argv[1]; c=open(p).read(); old='return [\"/arch:AVX512\"]'; new='return [\"/arch:AVX512\", \"-mavx512f\", \"-mavx512cd\", \"-mavx512bw\", \"-mavx512dq\", \"-mavx512vl\", \"-mavx512vnni\", \"-mavx512bf16\", \"-mavx512vbmi\", \"-mavx512fp16\", \"-mamx-tile\", \"-mamx-fp16\", \"-mamx-bf16\", \"-mamx-int8\"]'; open(p,'w').write(c if '-mavx512fp16' in c else c.replace(old, new))" {} \; 2>/dev/null || true
          }

          bazel fetch //xla/pjrt/c:pjrt_c_api_cpu_plugin.so || true
          patch_external_repos

          BUILD_CMD="bazel build //xla/pjrt/c:pjrt_c_api_cpu_plugin.so"

          eval $BUILD_CMD || {
            echo "Patching external repos and retrying build..."
            patch_external_repos
            eval $BUILD_CMD
          }

      - name: "Package the binary (zip)"
        run: |
          # Create the tarball.
          PJRT_C_API_HEADER="./xla/xla/pjrt/c/pjrt_c_api.h"
          ZIP_NAME="pjrt_cpu_windows_amd64.zip"
          BINARY_DIR="xla/bazel-bin/xla/pjrt/c"
          BINARY_NAME="pjrt_c_api_cpu_plugin.so"
          TARGET_NAME="pjrt_c_api_cpu_${RELEASE_VERSION}_plugin.dll"
          mv "xla/bazel-bin/xla/pjrt/c/${BINARY_NAME}" "${TARGET_NAME}"
          7z a "$ZIP_NAME" "${TARGET_NAME}"
          echo "ZIP_NAME=${ZIP_NAME}" >> $GITHUB_ENV

      - name: "Upload release asset"
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_VERSION }}
          files: ${{ env.ZIP_NAME }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
